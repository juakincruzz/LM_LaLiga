# Valores compartidos por las 5 ligas. current_season es la única fuente de
# verdad de "qué temporada es la actual" — antes "2526" estaba escrito a mano
# en 9 sitios del código. history_depth: temporadas anteriores que se suman a
# la actual para entrenar (ver app/config.py::get_training_seasons).
defaults:
  current_season: "2526"
  history_depth: 5

SP1:
  name: "La Liga"
  data_code: "SP1"
  country: "Spain"
  teams: 20
  transfermarkt_league_id: "ES1"
  next_season:
    code: "2627"
    label: "26/27"
    tm_season_id: "2026"
    # Edita estos nombres cuando conozcas los ascendidos reales.
    # Deben ser 3 para La Liga (20 equipos, 3 descensos).
    promoted_teams:
      - "Ascendido 1"
      - "Ascendido 2"
      - "Ascendido 3"

