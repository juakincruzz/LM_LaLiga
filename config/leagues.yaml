# El proyecto se centra solo en La Liga. La estructura por código de liga
# (SP1) se conserva porque es la clave de la BD, del directorio de datos y del
# nombre del modelo; app/config.py::LEAGUE_CODE es la constante que la usa.
#
# current_season es la única fuente de verdad de "qué temporada es la actual".
# history_depth: temporadas anteriores que se suman a la actual para entrenar
# (ver app/config.py::get_training_seasons).
defaults:
  current_season: "2627"
  history_depth: 5

SP1:
  name: "La Liga"
  data_code: "SP1"          # resultados: football-data.co.uk/mmz4281/{temporada}/SP1.csv
  calendar_code: "es.1"     # calendario: github.com/openfootball/football.json/{2026-27}/es.1.json
  country: "España"
  teams: 20
  next_season:
    code: "2728"
    label: "27/28"
    # Edita estos nombres cuando conozcas los ascendidos reales.
    # Deben ser 3 para La Liga (20 equipos, 3 descensos). Los nombres tienen
    # que ser los de football-data.co.uk (ver core/equipos.py).
    promoted_teams:
      - "Ascendido 1"
      - "Ascendido 2"
      - "Ascendido 3"
