# Palmarés de los clubes para la ficha de equipo (/equipo/{nombre}).
#
# Regla: solo títulos reconocidos oficialmente por la RFEF (nacionales) y la
# UEFA (europeos), con los recuentos de la Wikipedia en español. Los títulos
# discutidos no se suman a otra competición: la Copa de Ferias y la Copa Eva
# Duarte van en filas propias, y la Copa de la Coronación de 1902 no cuenta.
# La Copa de 1909 del Club Ciclista se atribuye a la Real Sociedad, como hace
# la Wikipedia en español.
#
# Se edita a mano cuando un club gana algo. Claves de equipo = nombres de
# football-data.co.uk. Equipo con {} = sin títulos oficiales; equipo ausente =
# «Palmarés no disponible». `ultimo` = temporada del último título.
#
# Última revisión: 2026-10-19 (incluye la temporada 2025/26).

competiciones:
  liga: Liga
  copa: Copa del Rey
  supercopa: Supercopa de España
  champions: Copa de Europa
  uefa: UEFA / Europa League
  conference: Conference League
  recopa: Recopa
  supercopa_europa: Supercopa de Europa
  copa_ferias: Copa de Ferias
  eva_duarte: Copa Eva Duarte

