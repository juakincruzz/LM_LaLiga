[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-laliga"
version = "0.2.0"
description = "Dashboard de predicción y simulación para 5 ligas europeas"
requires-python = ">=3.12"

dependencies = [
    # Datos y ML
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    # Web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.19.0",
    # Utilidades
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["app", "core", "models", "scripts"]

[tool.pytest.ini_options]
# testpaths evita que pytest intente recoger transfermarkt-api/tests (submódulo
# con sus propias dependencias), que hoy rompe `pytest` a secas.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not slow'"
markers = [
    "slow: tests lentos o que dependen de la red (se excluyen por defecto)",
]

[tool.ruff]
line-length = 110
extend-exclude = ["transfermarkt-api", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
