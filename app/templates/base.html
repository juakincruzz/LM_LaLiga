<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LM LaLiga Dashboard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-blue-900 text-white p-4 shadow-md">
        <div class="container mx-auto flex items-center justify-between">
            <a href="/" class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="trophy"></i>
                LM LaLiga
            </a>
            <div class="flex gap-4 text-sm">
                <a href="/" class="hover:text-blue-200 transition">Dashboard</a>
                {% for liga in ligas %}
                <a href="/league/{{ liga.code }}" class="hover:text-blue-200 transition"
                   title="{{ liga.name }}">{{ liga.code }}</a>
                {% endfor %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

    <script>
        lucide.createIcons();
        // Re-create icons after HTMX swaps
        document.body.addEventListener('htmx:afterSwap', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
